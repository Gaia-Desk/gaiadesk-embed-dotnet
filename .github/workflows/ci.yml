name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build GaiaDesk.Embed.sln --configuration Release

      # Tests that need the native library skip without it.
      - name: Test
        run: dotnet test GaiaDesk.Embed.sln --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Build the WinForms example
        if: runner.os == 'Windows'
        run: dotnet build examples/HelpDeskDemo.WinForms --configuration Release

      - name: Pack
        if: runner.os == 'Windows'
        run: dotnet pack src/GaiaDesk.Embed --configuration Release --no-build --output artifacts
